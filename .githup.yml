# Stux.Digital Status: https://status.stux.digital
# Checked every 5 minutes by .github/workflows/status.yml, using GitHup:
# https://github.com/StuxGroup/GitHup
site:
  name: Stux.Digital Status
  description: Live status of Stux.Digital and the client sites it takes from idea to online, checked every 5 minutes.
  # Its own badge icon (the Stux.Digital mark with a heartbeat badge, from Clients' scripts/badge-icons.py),
  # as on clients.stux.digital. Its dark avatar reads on both of GitHup's themes.
  logo: https://clients.stux.digital/assets/img/clients/stux-digital-status.png
  favicon: https://clients.stux.digital/assets/img/clients/stux-digital-status.png
  # Stux.Digital's dark-theme sky blue; GitHup darkens it on the light theme until it reads.
  accent: "#38BDF8"
  url: https://status.stux.digital/
  footer_links:
    - label: Stux.Digital Clients
      url: https://clients.stux.digital/
    - label: Report a problem
      url: https://github.com/StuxDigital/Status/issues/new

legal:
  operator: Stux.Digital
  company: "Stux.Digital is operated by Stux Group Ltd, a company registered in England and Wales (company no. 13160574), registered office 82a James Carter Road, Mildenhall, England, IP28 7DE."
  contact: legal@stux.digital
  host: GitHub Pages
  effective: 8 October 2026

defaults:
  timeout: 15
  retries: 2
  max_response_time: 15000  # ms; GitHup's default. Slower (but otherwise good) answers show as degraded

# Monitors are grouped into sections on the page, each with a combined status.
# Slugs come from the names, so moving a monitor between groups keeps its history.
# Not monitored yet: clients.stux.digital, clientpage.stux.digital, soonpage.stux.digital and
# maintenancepage.stux.digital. They all serve now, so each can be added to the Stux.Digital
# group, and the Clients site's cards pick up its badge from the monitor's slug. The first client
# site, Stux.Group, is monitored by Stux.Group Status (stux-group:stux-group), so there's no
# client-sites group here yet.
groups:
  - name: Stux.Digital
    description: The Stux.Digital studio's own site.
    monitors:
      - name: Stux.Digital
        url: https://stux.digital/
        description: The studio, and the front door for a new site

  - name: Shared
    description: The media every Stux.Digital site relies on.
    monitors:
      - name: Stux.Digital Media CDN
        url: https://global.media.stux.digital/icon.png
        description: Shared logos and images used across every Stux.Digital site

incidents:
  labels: [status]
